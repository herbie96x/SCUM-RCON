name: 🐞 Bug report
description: Something in SCUM-RCON isn't working as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Most "it doesn't work" cases are setup-related — please run through the checklist near the bottom first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SCUM-RCON version
      description: Release tag, or the version from the [SCUM-RCON] line in UE4SS.log
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: RCON client used
      options:
        - mcrcon
        - rcon-cli
        - BattleMetrics
        - WebRcon
        - Custom / own tool
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant UE4SS.log lines
      description: Paste the [SCUM-RCON] lines from ue4ss/UE4SS.log around the issue.
      render: text
  - type: checkboxes
    id: setup
    attributes:
      label: Setup checklist (the usual culprits)
      options:
        - label: "HookEngineTick = 1 is set in ue4ss/UE4SS-settings.ini ([Hooks] section)"
          required: true
        - label: "A real password is set in config.ini"
          required: true
  - type: textarea
    id: setup-notes
    attributes:
      label: Server / setup notes
      description: SCUM server version, host (self-hosted / GGHost / …), anything else relevant.
