name: 💡 Feature request
description: Suggest a new command, option, or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like to see?
      description: The command, option, or improvement you have in mind.
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: What's the use case?
      description: What are you trying to do? What problem does this solve for your server?
    validations:
      required: true
  - type: textarea
    id: rcon-usage
    attributes:
      label: How would you use it over RCON?
      description: "If it's a new command, roughly how should it look? e.g. SomeCommand <arg> Location <coords>"
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Alternatives you've considered, examples from other tools, etc.
